<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nghỉ phép THKC</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nghỉ phép THKC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b3fae">

<link rel="apple-touch-icon" href="icon2.png">
<link rel="icon" href="icon2.png">

<style>
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:#1b3fae;
  }
  iframe{
    position:fixed;
    top:0; right:0; bottom:0; left:0;
    border:none;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:block;
  }
  #loader{
    position:fixed;
    inset:0;
    background:#1b3fae;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:opacity .35s ease;
  }
  #loader img{
    width:88px;height:88px;border-radius:20px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #loader .spin{
    width:28px;height:28px;
    border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;
    border-radius:50%;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  #loader.hide{opacity:0;pointer-events:none;}
</style>
</head>
<body>
  <div id="loader">
    <img src="icon2.png" alt="Nghỉ phép THKC">
    <div class="spin"></div>
  </div>

  <iframe id="app" src="https://script.google.com/macros/s/AKfycbzJYxOuuVIEUDz1epm64AGKaYmrYl5iWmAXhCz1BQ4UwK1yVB6_vbHoIvkcMn0qMjwm/exec?app=1" allow="fullscreen"></iframe>

  <noscript>
    <p style="color:#fff;text-align:center;padding-top:40px;font-family:sans-serif">
      <a style="color:#fff" href="https://script.google.com/macros/s/AKfycbzJYxOuuVIEUDz1epm64AGKaYmrYl5iWmAXhCz1BQ4UwK1yVB6_vbHoIvkcMn0qMjwm/exec?app=1">Bấm vào đây để mở ứng dụng</a>
    </p>
  </noscript>

  <script>
    var l = document.getElementById('loader');
    setTimeout(function(){ l.classList.add('hide'); }, 500);
  </script>
</body>
</html>
